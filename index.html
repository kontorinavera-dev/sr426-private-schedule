let editingHomeworkId=null;

let weekOffset=0;


function normalize(value){

  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");

}


function loadHomework(){

  try{

    homework=JSON.parse(
      localStorage.getItem("sr426_homework") || "[]"
    );

  }catch(e){

    homework=[];

  }


  let changed=false;


  homework.forEach(item=>{

    if(!item.subjectId){

      const found=
        Object.entries(subjectNames)
        .find(
          ([id,name])=>
            normalize(name)===normalize(item.subject)
        );

      if(found){

        item.subjectId=found[0];

        changed=true;

      }

    }

  });


  if(changed){

    saveHomeworkData();

  }

}


function saveHomeworkData(){

  localStorage.setItem(
    "sr426_homework",
    JSON.stringify(homework)
  );

/* =========================================================

   ========================================================= */

function toISO(date){

  return `${date.getFullYear()}-${
    String(date.getMonth()+1).padStart(2,"0")
  }-${
    String(date.getDate()).padStart(2,"0")
  }`;

}


function formatDate(date){

  return date.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function formatShortDate(date){

  return date.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}


/* =========================================================
   ПОНЕДЕЛЬНИК НЕДЕЛИ
   ========================================================= */

function getMonday(offset=0){

  const now=new Date();

  now.setHours(0,0,0,0);

  const day=now.getDay();

  const diff=day===0 ? -6 : 1-day;

  now.setDate(
    now.getDate()+diff+offset*7
  );

  return now;

}


/* =========================================================
   ЧЁТНОСТЬ НЕДЕЛИ
   ========================================================= */

/*
  21.09.2026 – 27.09.2026
  = ЧЁТНАЯ НЕДЕЛЯ
*/

function getWeekType(date){

  const currentMonday=getMonday(0);

  const targetMonday=new Date(date);

  currentMonday.setHours(0,0,0,0);

  targetMonday.setHours(0,0,0,0);


  const diffDays=Math.round(
    (targetMonday-currentMonday)/86400000
  );


  const weekDifference=
    Math.floor(diffDays/7);


  return weekDifference%2===0
    ? "even"
    : "odd";

}


/* =========================================================

function getHomework(subjectId,dateISO){

  return homework.filter(item=>{

    if(item.subjectId){

      return (
        item.subjectId===subjectId &&
        item.date===dateISO
      );

    }

    return (
      item.date===dateISO &&
      normalize(item.subject)===
      normalize(subjectNames[subjectId])
    );

  });

}

    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   КАРТОЧКА ЗАНЯТИЯ
   ========================================================= */

function lessonHTML(lesson,date){

  const [
    subjectId,
    time,
    name,
    type,
    room,
    teacher
  ]=lesson;


  const dateISO=toISO(date);

  const hw=getHomework(
    subjectId,
    dateISO
  );


  let homeworkHTML="";


  if(hw.length){

    homeworkHTML=hw.map(item=>`

      <div class="homework-box">

        <div class="homework-title">
          Домашнее задание
        </div>

        <div class="homework-text">
          ${escapeHTML(item.text)}
        </div>

        <button
          class="add-hw"
          onclick="editHomework('${item.id}')"
        >
          Изменить
        </button>

      </div>

    `).join("");

  }else{

    homeworkHTML=`

      <button
        class="add-hw"
        onclick="openHomeworkModal(
          '${subjectId}',
          '${dateISO}'
        )"
      >
        ＋ Добавить Д/З
      </button>

    `;

  }


  return `

    <div class="lesson">

      <div class="lesson-time">
        ${time}
      </div>

      <div class="lesson-name">
        ${escapeHTML(name)}
      </div>

      <div class="lesson-meta">

        <span class="badge">
          ${escapeHTML(type)}
        </span>

        <span class="badge">
          ${escapeHTML(room)}
        </span>

        <span class="badge">
          ${escapeHTML(teacher)}
        </span>

      </div>

      ${homeworkHTML}

    </div>

  `;

}


/* =========================================================
   СЕГОДНЯ
   ========================================================= */

function renderToday(){

  const date=new Date();

  const day=date.getDay();

  const weekType=getWeekType(date);

  const info=schedule[day];

  const lessons=
    info
      ? info[weekType]
      : [];


  document.getElementById(
    "todayTitle"
  ).textContent=
    info
      ? `${info.name} · ${formatDate(date)}`
      : "";


  const container=
    document.getElementById(
      "todayLessons"
    );


  if(!lessons.length){

    container.innerHTML=
      '<div class="no-lessons">Сегодня занятий нет</div>';

    return;

  }


  container.innerHTML=
    lessons
      .map(lesson=>lessonHTML(lesson,date))
      .join("");

}


/* =========================================================
   НЕДЕЛЯ
   ========================================================= */

function changeWeek(direction){

  weekOffset+=direction;

  renderWeek();

}


function renderWeek(){

  const monday=
    getMonday(weekOffset);


  const sunday=
    new Date(monday);

  sunday.setDate(
    monday.getDate()+6
  );


  document.getElementById(
    "weekTitle"
  ).textContent=
    `${formatShortDate(monday)} — ${formatShortDate(sunday)}`;


  const container=
    document.getElementById(
      "weekLessons"
    );


  let html="";


  for(let i=0;i<6;i++){

    const date=
      new Date(monday);

    date.setDate(
      monday.getDate()+i
    );


    const day=date.getDay();

    const info=schedule[day];


    const lessons=
      info
        ? info[getWeekType(date)]
        : [];


    html+=`

      <div class="day-header">
        ${info.name} · ${formatDate(date)}
      </div>

    `;


    if(!lessons.length){

      html+=`

        <div
          class="no-lessons"
          style="margin-bottom:15px"
        >
          Занятий нет
        </div>

      `;

    }else{

      html+=
        lessons
          .map(
            lesson=>
              lessonHTML(lesson,date)
          )
          .join("");

    }

  }


  container.innerHTML=html;

}


/* =========================================================
   РАЗДЕЛЫ
   ========================================================= */

function openSection(section){

  document
    .querySelectorAll(".section")
    .forEach(
      el=>el.classList.remove("active")
    );


  document
    .getElementById(section)
    .classList.add("active");


  document
    .querySelectorAll(".nav-button")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.section===section
      );

    });


  if(section==="today"){

    renderToday();

  }


  if(section==="week"){

    renderWeek();

  }


  if(section==="homework"){

    renderHomework();

  }

}


/* =========================================================
   СПИСОК Д/З
   ========================================================= */

function renderHomework(){

  const container=
    document.getElementById(
      "homeworkList"
    );


  if(!homework.length){

    container.innerHTML=
      '<div class="empty">Домашних заданий пока нет</div>';

    return;

  }


  const sorted=
    [...homework].sort(
      (a,b)=>
        (a.date || "")
        .localeCompare(b.date || "")
    );


  container.innerHTML=
    sorted.map(item=>`

      <div class="hw-item">

        <div class="hw-subject">

          ${escapeHTML(
            item.subject ||
            subjectNames[item.subjectId] ||
            "Предмет"
          )}

        </div>

        <div class="hw-date">

          ${escapeHTML(
            formatISOForDisplay(item.date)
          )}

        </div>

        <div class="hw-text">

          ${escapeHTML(item.text)}

        </div>

        <div class="hw-actions">

          <button
            class="small-button"
            onclick="editHomework('${item.id}')"
          >
            Изменить
          </button>

          <button
            class="small-button"
            onclick="deleteHomeworkById('${item.id}')"
          >
            Удалить
          </button>

        </div>

      </div>

    `).join("");

}


function formatISOForDisplay(iso){

  if(!iso) return "";

  const parts=iso.split("-");


  return parts.length===3
    ? `${parts[2]}.${parts[1]}.${parts[0]}`
    : iso;

}


/* =========================================================
   ВЫБОР ПРЕДМЕТА
   ========================================================= */

function fillSubjectSelect(){

  document.getElementById(
    "hwSubject"
  ).innerHTML=

    Object.keys(subjectNames)
      .map(
        id=>
          `<option value="${id}">
            ${escapeHTML(subjectNames[id])}
          </option>`
      )
      .join("");

}


/* =========================================================
   ДОБАВЛЕНИЕ Д/З
   ========================================================= */

function openHomeworkModal(
  subjectId=null,
  dateISO=null
){

  editingHomeworkId=null;


  document.getElementById(
    "modalTitle"
  ).textContent=
    "Добавить Д/З";


  document.getElementById(
    "deleteArea"
  ).style.display="none";


  fillSubjectSelect();


  if(
    subjectId &&
    subjectNames[subjectId]
  ){

    document.getElementById(
      "hwSubject"
    ).value=subjectId;

  }


  document.getElementById(
    "hwDate"
  ).value=
    dateISO ||
    toISO(new Date());


  document.getElementById(
    "hwText"
  ).value="";


  document.getElementById(
    "modalBg"
  ).classList.add("show");

}


/* =========================================================
   ЗАКРЫТИЕ ОКНА
   ========================================================= */

function closeHomeworkModal(){

  document.getElementById(
    "modalBg"
  ).classList.remove("show");


  editingHomeworkId=null;

}


function backgroundClose(event){

  if(
    event.target.id==="modalBg"
  ){

    closeHomeworkModal();

  }

}


/* =========================================================
   СОХРАНЕНИЕ Д/З
   ========================================================= */

function saveHomework(){

  const subjectId=
    document.getElementById(
      "hwSubject"
    ).value;


  const date=
    document.getElementById(
      "hwDate"
    ).value;


  const text=
    document.getElementById(
      "hwText"
    ).value.trim();


  if(
    !subjectId ||
    !date ||
    !text
  ){

    alert(
      "Заполните предмет, дату и домашнее задание."
    );

    return;

  }


  const subject=
    subjectNames[subjectId];


  if(editingHomeworkId){

    const item=
      homework.find(
        x=>x.id===editingHomeworkId
      );


    if(item){

      item.subjectId=subjectId;
      item.subject=subject;
      item.date=date;
      item.text=text;

    }

  }else{

    homework.push({

      id:
        Date.now().toString()+
        Math.random()
          .toString(16)
          .slice(2),

      subjectId,

      subject,

      date,

      text

    });

  }


  saveHomeworkData();

  closeHomeworkModal();

  renderToday();

  renderWeek();

  renderHomework();

}


/* =========================================================
   РЕДАКТИРОВАНИЕ Д/З
   ========================================================= */

function editHomework(id){

  const item=
    homework.find(
      x=>x.id===id
    );


  if(!item) return;


  editingHomeworkId=id;


  fillSubjectSelect();


  document.getElementById(
    "modalTitle"
  ).textContent=
    "Изменить Д/З";


  document.getElementById(
    "hwSubject"
  ).value=
    item.subjectId || "";


  document.getElementById(
    "hwDate"
  ).value=
    item.date || "";


  document.getElementById(
    "hwText"
  ).value=
    item.text || "";


  document.getElementById(
    "deleteArea"
  ).style.display="block";


  document.getElementById(
    "modalBg"
  ).classList.add("show");

}


/* =========================================================
   УДАЛЕНИЕ Д/З
   ========================================================= */

function deleteHomework(){

  if(!editingHomeworkId) return;

  deleteHomeworkById(
    editingHomeworkId
  );

  closeHomeworkModal();

}


function deleteHomeworkById(id){

  homework=
    homework.filter(
      item=>item.id!==id
    );


  saveHomeworkData();

  renderToday();

  renderWeek();

  renderHomework();

}


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>
      navigator.serviceWorker
        .register("./sw.js")
        .catch(()=>{})
  );

}


/* =========================================================
   ЗАПУСК
   ========================================================= */

loadHomework();

renderToday();

renderWeek();

renderHomework();

</script>

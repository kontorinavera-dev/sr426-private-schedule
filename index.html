/* =====================================================
   ОПРЕДЕЛЕНИЕ ЧЁТНОЙ / НЕЧЁТНОЙ НЕДЕЛИ
===================================================== */

function getWeekType(date = new Date()){

  const start = new Date(2026,8,1);

  const current =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

  const diff =
    Math.floor(
      (current - start) / 86400000
    );

  const weekNumber =
    Math.floor(diff / 7) + 1;

  return weekNumber % 2 === 1
    ? "odd"
    : "even";
}


/* =====================================================
   ДЕНЬ НЕДЕЛИ
===================================================== */

function getDayName(date){

  const names = [
    "Вс",
    "Пн",
    "Вт",
    "Ср",
    "Чт",
    "Пт",
    "Сб"
  ];

  return names[date.getDay()];
}


/* =====================================================
   ФОРМАТ ДАТЫ
===================================================== */

function formatDate(date){

  return String(date.getDate()).padStart(2,"0")
    + "."
    + String(date.getMonth()+1).padStart(2,"0")
    + "."
    + date.getFullYear();

}


/* =====================================================
   ДОМАШНИЕ ЗАДАНИЯ
===================================================== */

function getHomework(){

  try{

    return JSON.parse(
      localStorage.getItem("sr426_homework") || "[]"
    );

  }catch(e){

    return [];

  }

}


/* =====================================================
   ЭКРАНИРОВАНИЕ ТЕКСТА
===================================================== */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   ПОИСК Д/З ДЛЯ ПРЕДМЕТА
===================================================== */

function findHomework(subject,date){

  const items = getHomework();

  const target =
    String(date);

  return items.filter(item => {

    return item.subject.trim().toLowerCase()
      === subject.trim().toLowerCase()
      &&
      item.date === target;

  });

}

function renderToday(){

      </div>

      <div class="empty">

        Занятий нет.
      </div>

    `;

  }


  const type =
    getWeekType(today);

  const lessons =
    schedule[type][day] || [];


  let html = `

    <div class="section-title">
      Сегодня · ${formatDate(today)}
    </div>

  `;


  if(!lessons.length){

    html += `

      <div class="empty">
        Сегодня занятий нет.
      </div>

    `;

  }else{

    lessons.forEach(lesson => {

      html += lessonCard(
        lesson,
        formatDate(today)
      );

    });

  }


  return html;

}


/* =====================================================

===================================================== */

function renderWeek(){

  const base =
    new Date();

  base.setDate(
    base.getDate() +
    weekOffset * 7
  );


  const monday =
    new Date(base);

  const day =
    monday.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;


  monday.setDate(
    monday.getDate() + diff
  );


  const type =
    getWeekType(monday);


  const weekEnd =
    new Date(monday);

  weekEnd.setDate(
    monday.getDate() + 5
  );


  let html = `

    <div class="week-head">

      <button onclick="changeWeek(-1)">
        ‹
      </button>

      <div class="week-title">
        ${formatDate(monday)}
        —
        ${formatDate(weekEnd)}
      </div>

      <button onclick="changeWeek(1)">
        ›
      </button>

    </div>


    <div class="section-title">
      ${
        type === "odd"
          ? "Нечётная неделя"
          : "Чётная неделя"
      }
    </div>

  `;


  days.forEach((d,index) => {

    const lessons =
      schedule[type][d] || [];


    const date =
      new Date(monday);

    date.setDate(
      monday.getDate() + index
    );


    const dateString =
      formatDate(date);


    html += `

      <div class="day-title">
        ${d} · ${dateString}
      </div>

    `;


    if(!lessons.length){

      html += `

        <div class="empty">
          Занятий нет
        </div>

      `;

    }else{

      lessons.forEach(lesson => {

        html += lessonCard(
          lesson,
          dateString
        );

      });

    }

  });


  return html;

}


/* =====================================================

    </div>


    <button
      class="add-button"
      onclick="openModal()"
    >
      ＋ Добавить домашнее задание
    </button>

  `;


  if(!items.length){

    html += `

      <div class="empty">

        Пока нет домашних заданий.

        <br><br>

        Добавь первое задание,
        и оно автоматически появится
        под нужным предметом.

      </div>

    `;

    return html;

  }


  items
    .sort((a,b) =>
      a.date.localeCompare(b.date)
    )
    .forEach(item => {

      html += `

        <div class="homework-item">

          <div class="homework-date">
            ${escapeHtml(item.date)}
          </div>

          <div class="homework-subject">
            ${escapeHtml(item.subject)}
          </div>

          <div class="homework-text">
            ${escapeHtml(item.text)}
          </div>

          <br>

          <button
            onclick="deleteHomeworkById('${item.id}')"
            style="
              background:#f0f2f6;
              padding:8px 12px;
              border-radius:10px;
              color:#68748b;
            "
          >
            Удалить
          </button>

        </div>

      `;

    });


  return html;

}


/* =====================================================
   О САЙТЕ
===================================================== */

function renderAbout(){

  return `

    <div class="section-title">
      О сайте
    </div>


    <div class="about-card">

      <h2>СР-426</h2>

      <p>
        Личное расписание группы СР-426.
      </p>

      <p>
        Здесь можно посмотреть расписание
        занятий по дням и неделям.
      </p>

      <p>
        Домашнее задание можно добавить
        к конкретному предмету и дате.
      </p>

      <p>
        После добавления оно автоматически
        отображается прямо под соответствующим
        занятием.
      </p>

      <p>
        Все домашние задания сохраняются
        на этом устройстве.
      </p>

    </div>

  `;

}


/* =====================================================
   ОКНО ДОБАВЛЕНИЯ
===================================================== */

function openModal(){

  document
    .getElementById("homeworkModal")
    .classList.add("show");

}


function closeModal(){

  document
    .getElementById("homeworkModal")
    .classList.remove("show");

}


/* =====================================================
   СОХРАНЕНИЕ Д/З
===================================================== */

function saveHomework(){

  const subject =
    document
      .getElementById("hwSubject")
      .value
      .trim();


  const date =
    document
      .getElementById("hwDate")
      .value;


  const text =
    document
      .getElementById("hwText")
      .value
      .trim();


  if(!subject || !date || !text){

    alert(
      "Заполни предмет, дату и домашнее задание."
    );

    return;

  }


  const items =
    getHomework();


  items.push({

    id:
      Date.now().toString()
      +
      Math.random()
        .toString(36)
        .slice(2),

    subject:subject,

    date:date,

    text:text

  });


  localStorage.setItem(
    "sr426_homework",
    JSON.stringify(items)
  );


  document
    .getElementById("hwSubject")
    .value = "";


  document
    .getElementById("hwDate")
    .value = "";


  document
    .getElementById("hwText")
    .value = "";


  closeModal();


  render();

}


/* =====================================================
   УДАЛЕНИЕ Д/З
===================================================== */

function deleteHomeworkById(id){

  const items =
    getHomework()
      .filter(item =>
        String(item.id) !== String(id)
      );


  localStorage.setItem(
    "sr426_homework",
    JSON.stringify(items)
  );


  render();

}


/* =====================================================
   НАВИГАЦИЯ
===================================================== */

function showSection(section){

  currentSection =
    section;

  weekOffset =
    0;

  render();

}


/* =====================================================
   ОТРИСОВКА
===================================================== */

function render(){

  const content =
    document.getElementById("content");


  if(currentSection === "today"){

    content.innerHTML =
      renderToday();

  }

  else if(currentSection === "week"){

    content.innerHTML =
      renderWeek();

  }

  else if(currentSection === "homework"){

    content.innerHTML =
      renderHomework();

  }

  else if(currentSection === "about"){

    content.innerHTML =
      renderAbout();

  }


  document
    .querySelectorAll(".nav button")
    .forEach(button =>
      button.classList.remove("active")
    );


  const active =
    document.getElementById(
      "nav-" + currentSection
    );


  if(active){

    active.classList.add("active");

  }

}


/* =====================================================
   ЗАПУСК
===================================================== */

render();

</script>

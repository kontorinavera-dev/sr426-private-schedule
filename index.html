<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>СР-426</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#68748b;
  --blue:#1677ff;
  --soft:#e9edf5;
  --line:#e0e4eb;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif
}

body{
  padding-bottom:112px
}

button{
  font:inherit;
  border:0;
  cursor:pointer
}

.app{
  max-width:820px;
  margin:0 auto;
  padding:42px 36px 28px
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px
}

.title h1{
  margin:0;
  font-size:54px;
  line-height:1;
  font-weight:750;
  letter-spacing:-2px
}

.title p{
  margin:15px 0 0;
  font-size:29px;
  color:var(--muted);
  letter-spacing:-.5px
}

.info{
  width:86px;
  height:86px;
  border-radius:29px;
  background:#fff;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:700;
  box-shadow:0 8px 25px rgba(20,35,60,.06)
}

.section-title{
  font-size:28px;
  font-weight:750;
  margin:25px 0 16px
}

.card{
  background:var(--card);
  border-radius:27px;
  padding:23px;
  margin-bottom:15px;
  box-shadow:0 7px 25px rgba(25,40,65,.06)
}

.lesson-time{
  font-size:18px;
  color:var(--blue);
  font-weight:700;
  margin-bottom:8px
}

.lesson-name{
  font-size:23px;
  line-height:1.22;
  font-weight:700;
  margin-bottom:10px
}

.lesson-meta{
  color:var(--muted);
  font-size:16px;
  line-height:1.45
}

.type{
  display:inline-block;
  background:var(--soft);
  padding:5px 10px;
  border-radius:10px;
  margin-right:6px;
  margin-bottom:4px
}

.empty{
  background:#fff;
  border-radius:27px;
  padding:32px 24px;
  text-align:center;
  color:var(--muted);
  font-size:18px;
  box-shadow:0 7px 25px rgba(25,40,65,.05)
}

.week-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px
}

.week-head button{
  width:45px;
  height:45px;
  border-radius:15px;
  background:#fff;
  color:var(--blue);
  font-size:25px;
  box-shadow:0 5px 18px rgba(25,40,65,.06)
}

.week-title{
  text-align:center;
  font-size:21px;
  font-weight:750
}

.day-title{
  font-size:23px;
  font-weight:750;
  margin:25px 0 12px
}

.homework-item{
  background:#fff;
  border-radius:23px;
  padding:20px;
  margin-bottom:13px;
  box-shadow:0 7px 25px rgba(25,40,65,.05)
}

.homework-date{
  font-size:14px;
  color:var(--blue);
  font-weight:700;
  margin-bottom:6px
}

.homework-subject{
  font-size:19px;
  font-weight:700;
  margin-bottom:7px
}

.homework-text{
  font-size:16px;
  line-height:1.45;
  color:var(--muted);
  white-space:pre-wrap
}

.add-button{
  width:100%;
  background:var(--blue);
  color:#fff;
  padding:17px;
  border-radius:20px;
  font-size:18px;
  font-weight:700;
  margin-bottom:18px
}

.about-card{
  background:#fff;
  border-radius:27px;
  padding:26px;
  box-shadow:0 7px 25px rgba(25,40,65,.05);
  line-height:1.55;
  color:#374151
}

.about-card h2{
  margin:0 0 12px;
  font-size:25px;
  color:var(--text)
}

.nav{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  width:min(760px,calc(100% - 24px));
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:27px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  box-shadow:0 10px 35px rgba(25,40,65,.13);
  z-index:50
}

.nav button{
  background:transparent;
  color:#7b8494;
  padding:11px 5px 10px;
  border-radius:19px;
  font-size:13px;
  font-weight:650
}

.nav button.active{
  background:#eaf2ff;
  color:var(--blue)
}

.nav-icon{
  display:block;
  font-size:23px;
  line-height:24px;
  margin-bottom:4px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,20,35,.35);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  z-index:100;
  align-items:flex-end;
  justify-content:center
}

.modal.show{
  display:flex
}

.modal-box{
  width:min(820px,100%);
  background:#fff;
  border-radius:30px 30px 0 0;
  padding:27px;
  padding-bottom:calc(27px + env(safe-area-inset-bottom))
}

.modal-box h2{
  margin:0 0 18px;
  font-size:25px
}

.input,
.textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
  font:inherit;
  outline:none;
  background:#f8f9fc;
  margin-bottom:12px
}

.textarea{
  min-height:130px;
  resize:vertical
}

.modal-actions{
  display:flex;
  gap:10px
}

.modal-actions button{
  flex:1;
  padding:15px;
  border-radius:17px;
  font-weight:700
}

.cancel{
  background:var(--soft);
  color:#4b5563
}

.save{
  background:var(--blue);
  color:#fff
}

.hidden{
  display:none!important
}

@media(max-width:600px){
  .app{
    padding:32px 16px 25px
  }

  .title h1{
    font-size:45px
  }

  .title p{
    font-size:22px;
    margin-top:10px
  }

  .info{
    width:64px;
    height:64px;
    border-radius:22px;
    font-size:27px
  }

  .section-title{
    font-size:25px
  }

  .lesson-name{
    font-size:20px
  }

  .card{
    padding:20px;
    border-radius:23px
  }

  .nav{
    bottom:10px;
    width:calc(100% - 18px);
    border-radius:24px
  }

  .nav button{
    font-size:11px
  }

  .nav-icon{
    font-size:21px
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="title">
      <h1>СР-426</h1>
      <p>Расписание занятий</p>
    </div>

    <button class="info" onclick="showSection('about')">i</button>
  </div>

  <main id="content"></main>

</div>

<nav class="nav">
  <button id="nav-today" onclick="showSection('today')">
    <span class="nav-icon">☀️</span>
    Сегодня
  </button>

  <button id="nav-week" onclick="showSection('week')">
    <span class="nav-icon">▦</span>
    Неделя
  </button>

  <button id="nav-homework" onclick="showSection('homework')">
    <span class="nav-icon">✓</span>
    Д/З
  </button>

  <button id="nav-about" onclick="showSection('about')">
    <span class="nav-icon">ⓘ</span>
    О сайте
  </button>
</nav>


<div class="modal" id="homeworkModal">
  <div class="modal-box">
    <h2>Добавить домашнее задание</h2>

    <input
      class="input"
      id="hwSubject"
      placeholder="Предмет"
    >

    <input
      class="input"
      id="hwDate"
      type="date"
    >

    <textarea
      class="textarea"
      id="hwText"
      placeholder="Что нужно сделать?"
    ></textarea>

    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Отмена</button>
      <button class="save" onclick="saveHomework()">Сохранить</button>
    </div>
  </div>
</div>


<script>

const schedule = {

  odd: {
    "Пн": [
      ["10:50–12:10","Технологии презентации рекламного креатива","Практика","6411","Кобозева Д.Л."],
      ["12:25–13:45","История России","Практика","6401","Гаврилов А.Ю."],
      ["17:40–19:00","Основы маркетинга","Лекция","Дистанционно","Андреева А.Л."]
    ],

    "Вт": [
      ["09:15–10:35","Основы теории коммуникации","Лекция","Дистанционно","Королева К.Ю."],
      ["10:50–12:10","Технологии самообразования и творческого саморазвития","Лекция","Дистанционно","Хлапотин Ю.Н."],
      ["16:05–17:25","Иностранный язык","Практика","6402","Преподаватель кафедры"],
      ["17:40–19:00","Теория и история рекламы и связей с общественностью","Практика","1815","Хрусловский В.А."]
    ],

    "Ср": [
      ["12:25–13:45","Основы маркетинга","Практика","6111-1","Андреева А.Л."],
      ["14:25–15:45","Основы теории коммуникации","Практика","3319","Королева К.Ю."],
      ["16:05–17:25","Элективные дисциплины по физической культуре и спорту","Практика","Спорт. зал","Преподаватель кафедры"]
    ],

    "Чт": [],

    "Пт": [
      ["14:25–15:45","Основы российской государственности","Практика","6401","Овечкина А.К."],
      ["16:05–17:25","Основы профессионального развития","Практика","6304","Гайтукаева Г.Р."]
    ],

    "Сб": [
      ["12:25–13:45","Основы маркетинга","Лекция","Дистанционно","Андреева А.Л."]
    ]
  },

  even: {
    "Пн": [],

    "Вт": [
      ["09:15–10:35","Технологии презентации рекламного креатива","Лекция","Дистанционно","Кобозева Д.Л."],
      ["16:05–17:25","Иностранный язык","Практика","6402","Преподаватель кафедры"],
      ["17:40–19:00","Теория и история рекламы и связей с общественностью","Практика","1815","Хрусловский В.А."]
    ],

    "Ср": [
      ["10:50–12:10","Технологии самообразования и творческого саморазвития","Практика","6302","Хлапотин Ю.Н."],
      ["12:25–13:45","Основы маркетинга","Практика","6111-1","Андреева А.Л."],
      ["14:25–15:45","Основы теории коммуникации","Практика","3319","Королева К.Ю."],
      ["16:05–17:25","Элективные дисциплины по физической культуре и спорту","Практика","Спорт. зал","Преподаватель кафедры"]
    ],

    "Чт": [],

    "Пт": [
      ["09:15–10:35","История рекламы и связей с общественностью","Лекция","Дистанционно","Хрусловский В.А."],
      ["10:50–12:10","Основы профессионального развития","Лекция","Дистанционно","Гайтукаева Г.Р."],
      ["14:25–15:45","Основы российской государственности","Практика","6401","Овечкина А.К."],
      ["16:05–17:25","Основы профессионального развития","Практика","6304","Гайтукаева Г.Р."]
    ],

    "Сб": []
  }
};


const days = ["Пн","Вт","Ср","Чт","Пт","Сб"];

let currentSection = "today";
let weekOffset = 0;


function getWeekType(date = new Date()) {

  const start = new Date(2026, 8, 1);

  const diff =
    Math.floor(
      (new Date(date.getFullYear(),date.getMonth(),date.getDate()) - start) /
      86400000
    );

  const weekNumber = Math.floor(diff / 7) + 1;

  return weekNumber % 2 === 1 ? "odd" : "even";
}


function getDayName(date) {

  const names = [
    "Вс",
    "Пн",
    "Вт",
    "Ср",
    "Чт",
    "Пт",
    "Сб"
  ];

  return names[date.getDay()];
}


function formatDate(date) {

  return String(date.getDate()).padStart(2,"0") + "." +
         String(date.getMonth()+1).padStart(2,"0") + "." +
         date.getFullYear();
}


function lessonCard(lesson) {

  return `
    <div class="card">

      <div class="lesson-time">
        ${lesson[0]}
      </div>

      <div class="lesson-name">
        ${lesson[1]}
      </div>

      <div class="lesson-meta">

        <span class="type">
          ${lesson[2]}
        </span>

        ${lesson[3]}

        <br>

        ${lesson[4]}

      </div>

    </div>
  `;
}


function renderToday() {

  const today = new Date();
  const day = getDayName(today);

  if(day === "Вс") {

    return `
      <div class="section-title">
        Сегодня
      </div>

      <div class="empty">
        Сегодня воскресенье.<br>
        Занятий нет.
      </div>
    `;
  }

  const type = getWeekType(today);
  const lessons = schedule[type][day] || [];

  let html = `
    <div class="section-title">
      Сегодня · ${formatDate(today)}
    </div>
  `;

  if(!lessons.length) {

    html += `
      <div class="empty">
        Сегодня занятий нет.
      </div>
    `;

  } else {

    lessons.forEach(l => {
      html += lessonCard(l);
    });

  }

  return html;
}


function renderWeek() {

  const base = new Date();

  base.setDate(
    base.getDate() +
    weekOffset * 7
  );

  const monday = new Date(base);

  const day = monday.getDay();

  const diff =
    day === 0 ? -6 : 1 - day;

  monday.setDate(
    monday.getDate() + diff
  );

  const type = getWeekType(monday);

  const weekEnd = new Date(monday);
  weekEnd.setDate(monday.getDate()+5);

  let html = `

    <div class="week-head">

      <button onclick="changeWeek(-1)">
        ‹
      </button>

      <div class="week-title">
        ${formatDate(monday)}
        —
        ${formatDate(weekEnd)}
      </div>

      <button onclick="changeWeek(1)">
        ›
      </button>

    </div>

    <div class="section-title">
      ${type === "odd" ? "Нечётная неделя" : "Чётная неделя"}
    </div>
  `;

  days.forEach(d => {

    const lessons = schedule[type][d] || [];

    html += `
      <div class="day-title">
        ${d}
      </div>
    `;

    if(!lessons.length) {

      html += `
        <div class="empty">
          Занятий нет
        </div>
      `;

    } else {

      lessons.forEach(l => {
        html += lessonCard(l);
      });

    }

  });

  return html;
}


function changeWeek(value) {

  weekOffset += value;

  render();
}


function getHomework() {

  try {

    return JSON.parse(
      localStorage.getItem("sr426_homework") || "[]"
    );

  } catch(e) {

    return [];

  }
}


function renderHomework() {

  const items = getHomework();

  let html = `

    <div class="section-title">
      Домашние задания
    </div>

    <button class="add-button" onclick="openModal()">
      ＋ Добавить домашнее задание
    </button>

  `;

  if(!items.length) {

    html += `
      <div class="empty">
        Пока нет домашних заданий.
      </div>
    `;

    return html;
  }

  items
    .sort((a,b) => a.date.localeCompare(b.date))
    .forEach((item,index) => {

      html += `

        <div class="homework-item">

          <div class="homework-date">
            ${item.date}
          </div>

          <div class="homework-subject">
            ${escapeHtml(item.subject)}
          </div>

          <div class="homework-text">
            ${escapeHtml(item.text)}
          </div>

          <br>

          <button
            onclick="deleteHomework(${index})"
            style="
              background:#f0f2f6;
              padding:8px 12px;
              border-radius:10px;
              color:#68748b;
            "
          >
            Удалить
          </button>

        </div>

      `;

    });

  return html;
}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function openModal() {

  document.getElementById("homeworkModal")
    .classList.add("show");

}


function closeModal() {

  document.getElementById("homeworkModal")
    .classList.remove("show");

}


function saveHomework() {

  const subject =
    document.getElementById("hwSubject").value.trim();

  const date =
    document.getElementById("hwDate").value;

  const text =
    document.getElementById("hwText").value.trim();

  if(!subject || !date || !text) {

    alert("Заполни все поля.");

    return;
  }

  const items = getHomework();

  items.push({
    subject,
    date,
    text
  });

  localStorage.setItem(
    "sr426_homework",
    JSON.stringify(items)
  );

  document.getElementById("hwSubject").value = "";
  document.getElementById("hwDate").value = "";
  document.getElementById("hwText").value = "";

  closeModal();

  render();

}


function deleteHomework(index) {

  const items = getHomework();

  items.splice(index,1);

  localStorage.setItem(
    "sr426_homework",
    JSON.stringify(items)
  );

  render();

}


function renderAbout() {

  return `

    <div class="section-title">
      О сайте
    </div>

    <div class="about-card">

      <h2>СР-426</h2>

      <p>
        Личное расписание группы СР-426.
      </p>

      <p>
        Здесь можно посмотреть расписание
        занятий по дням и неделям, а также
        сохранять домашние задания.
      </p>

      <p>
        Расписание разделено на чётные
        и нечётные недели.
      </p>

      <p>
        Домашние задания сохраняются
        непосредственно на этом устройстве.
      </p>

    </div>

  `;
}


function showSection(section) {

  currentSection = section;

  weekOffset = 0;

  render();

}


function render() {

  const content =
    document.getElementById("content");

  if(currentSection === "today") {

    content.innerHTML = renderToday();

  }

  else if(currentSection === "week") {

    content.innerHTML = renderWeek();

  }

  else if(currentSection === "homework") {

    content.innerHTML = renderHomework();

  }

  else if(currentSection === "about") {

    content.innerHTML = renderAbout();

  }


  document.querySelectorAll(".nav button")
    .forEach(button => button.classList.remove("active"));

  const active =
    document.getElementById(
      "nav-" + currentSection
    );

  if(active) {
    active.classList.add("active");
  }

}


render();

</script>

</body>
</html>
